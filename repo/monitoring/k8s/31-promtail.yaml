apiVersion: v1
kind: ConfigMap
metadata: {name: promtail-config, namespace: monitoring}
data:
  promtail.yaml: |
    server: {http_listen_port: 9080}
    positions: {filename: /tmp/positions.yaml}
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: shop-pods
        static_configs:
          - targets: [localhost]
            labels: {__path__: /var/log/pods/shop_shop-*/*/*.log, app: shop, namespace: shop}
          - targets: [localhost]
            labels: {__path__: /var/log/pods/shop_mariadb-*/*/*.log, app: mariadb, namespace: shop}
          - targets: [localhost]
            labels: {__path__: /var/log/pods/monitoring_*/*/*.log, app: monitoring, namespace: monitoring}

---
apiVersion: v1
kind: ServiceAccount
metadata: {name: promtail, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: promtail}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: promtail}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promtail}
subjects: [{kind: ServiceAccount, name: promtail, namespace: monitoring}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: promtail, namespace: monitoring}
spec:
  selector: {matchLabels: {app: promtail}}
  template:
    metadata: {labels: {app: promtail}}
    spec:
      serviceAccountName: promtail
      tolerations: [{operator: Exists}]
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/promtail}
            - {name: logs, mountPath: /var/log, readOnly: true}
      volumes:
        - name: config
          configMap: {name: promtail-config}
        # kind nodes run containerd: /var/log/pods symlinks resolve inside /var/log
        - name: logs
          hostPath: {path: /var/log}
