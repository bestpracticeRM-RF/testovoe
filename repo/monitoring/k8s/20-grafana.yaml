apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  ds.yaml: |
    apiVersion: 1
    datasources:
      - name: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      - name: loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: shoplite
        folder: ShopLite
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: monitoring
data:
  shoplite.json: |
    {"title": "ShopLite", "uid": "shoplite", "refresh": "15s",
     "panels": [
       {"type": "stat", "title": "pool in_use", "gridPos": {"x":0,"y":0,"w":4,"h":4},
        "targets": [{"expr": "shop_pool_in_use"}]},
       {"type": "stat", "title": "pool idle", "gridPos": {"x":4,"y":0,"w":4,"h":4},
        "targets": [{"expr": "shop_pool_idle"}]},
       {"type": "timeseries", "title": "responses/s by code", "gridPos": {"x":8,"y":0,"w":8,"h":8},
        "targets": [{"expr": "sum by (code) (rate(shop_responses_total[1m]))"}]},
       {"type": "logs", "title": "app logs (loki)", "gridPos": {"x":0,"y":8,"w":16,"h":6},
        "targets": [{"expr": "{app=\"shop\"}", "datasource": {"type": "loki", "uid": "loki"}}]},
       {"type": "timeseries", "title": "5xx/s (must be 0)", "gridPos": {"x":0,"y":4,"w":8,"h":4},
        "targets": [{"expr": "sum(rate(shop_responses_total{code=~\"5..\"}[1m]))"}]}
     ],
     "schemaVersion": 39, "version": 1}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provider, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboard, mountPath: /var/lib/grafana/dashboards}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: provider
          configMap: {name: grafana-dashboards-provider}
        - name: dashboard
          configMap: {name: grafana-dashboard}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - port: 3000
      nodePort: 32301
