apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/rules/*.yaml]
    scrape_configs:
      - job_name: shop
        static_configs:
          - targets: ["shop.shop.svc.cluster.local:80"]
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: mariadb
        static_configs:
          - targets: ["mysqld-exporter.monitoring.svc.cluster.local:9104"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  shoplite.yaml: |
    groups:
      - name: shoplite
        rules:
          - alert: Edge5xxElevated
            expr: sum(rate(shop_responses_total{code=~"5.."}[5m])) / clamp_min(sum(rate(shop_responses_total[5m])), 0.001) > 0.10
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "5xx > 10% for 5m (incident lesson: stable 29% was a real outage)"
          - alert: ShopPoolExhaustionTrend
            expr: avg(shop_pool_in_use) >= 3.5 and avg(shop_pool_idle) < 0.5
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "pool nearly exhausted: in_use high, idle ~0"
          - alert: DBConnectionsNearLimit
            expr: max(mysql_global_status_threads_connected) / max(mysql_global_variables_max_connections) > 0.70
            for: 5m
            labels: {severity: warning}
            annotations:
              summary: "DB connections >70% of max_connections for 5m (the 17.09 incident alert)"
          - alert: DBConnectionsCritical
            expr: max(mysql_global_status_threads_connected) / max(mysql_global_variables_max_connections) > 0.85
            for: 2m
            labels: {severity: critical}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: rules, mountPath: /etc/prometheus/rules}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: rules
          configMap: {name: prometheus-rules}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - port: 9090
      nodePort: 32300
