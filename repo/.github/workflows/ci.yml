name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml pytest pymysql
      - name: Manifest gate (parse + regression load against ephemeral stand)
        run: |
          # full gate requires a running stand (up.sh); on CI we run the parse part,
          # the load regression runs on the stand host via tools/check.sh
          python3 tools/manifest_lint.py || tools/check.sh
