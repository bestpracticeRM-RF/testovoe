worker_processes auto;
pid /usr/local/openresty/nginx/logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ua="$upstream_addr" us=$upstream_status';
    access_log /dev/stdout edge;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    include /usr/local/openresty/nginx/conf/sites-enabled/*.conf;
}
